services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fulfilment
      POSTGRES_USER: fulfilment
      POSTGRES_PASSWORD: fulfilment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilment"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
