port = 8080
port = ${?FULFILMENT_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?FULFILMENT_SERVICE_METRICS_PORT}

service-name = "fulfilment-service"
service-name = ${?FULFILMENT_SERVICE_NAME}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "fulfilment"
  database = ${?POSTGRES_DB}
  user = "fulfilment"
  user = ${?POSTGRES_USER}
  password = "fulfilment"
  password = ${?POSTGRES_PASSWORD}
}

# example-client is not read by the live service (fulfilment-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}

# example-kafka-producer is not read by the live service (fulfilment-service
# has no outbound Kafka publish call to make) - it exists only so
# KafkaProducerResilienceExampleSuite can demonstrate loading a purekafka
# ResilienceConfig via PureConfig, the same way a real producer's config would
# be loaded in Main. See docs/examples.md.
example-kafka-producer {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
